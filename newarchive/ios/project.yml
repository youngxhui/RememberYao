name: RememberYao
options:
  bundleIdPrefix: top.youngxhui
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    # 必须显式开：AppDelegate + SceneDelegate 的生命周期全靠它。
    # 漏了这条，UIKit 不建 scene session，SceneDelegate.scene(_:willConnectTo:)
    # 永不触发 → 没有任何地方创建 UIWindow → 启动后一片空白（不崩，但没界面）。
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_CFBundleDisplayName: "忆药"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  RememberYao:
    type: application
    platform: iOS
    sources:
      - path: RememberYao
        excludes:
          - "**/.DS_Store"
    resources:
      - path: RememberYao/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.youngxhui.rememberyao
        PRODUCT_NAME: RememberYao
        SDKROOT: iphoneos
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
