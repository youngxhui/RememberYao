appId: com.youngxhui.RememberYao
---
- launchApp
# 首次启动先过引导页
- extendedWaitUntil:
    visible: "用药提醒"
    timeout: 30000
- tapOn: "下一步"
- tapOn: "开始使用"
- extendedWaitUntil:
    visible:
      id: "medica-tab"
    timeout: 30000
# 底部四个 tab 均应存在
- assertVisible:
    id: "home-tab"
- assertVisible:
    id: "medica-tab"
- assertVisible:
    id: "records-tab"
- assertVisible:
    id: "profile-tab"

# 逐个点击切换，确认 tab 可交互
- tapOn:
    id: "medica-tab"
- assertVisible:
    id: "medica-tab"

- tapOn:
    id: "home-tab"
- assertVisible:
    id: "home-tab"

- tapOn:
    id: "records-tab"
- assertVisible: "服药记录"

- tapOn:
    id: "profile-tab"
- assertVisible: "设置"
