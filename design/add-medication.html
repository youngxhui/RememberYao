<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>记得吃药 · 添加药品</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
  <style>
    :root {
      --bg: #f0f4f2;
      --surface: #ffffff;
      --fg: #0f172a;
      --fg-2: #334155;
      --muted: #64748b;
      --border: #e2e8e5;
      --accent: #0d9488;
      --accent-strong: #0f766e;
      --accent-soft: color-mix(in oklab, var(--accent) 14%, transparent);
      --fg-soft: color-mix(in oklab, var(--fg) 6%, transparent);
      --success: #10b981;
      --success-strong: #047857;
      --warn: #f59e0b;
      --warn-strong: #b45309;
      --danger: #ef4444;
      --danger-strong: #dc2626;

      --font-display: Inter, system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;

      --fs-h1: 32px;
      --fs-h2: 22px;
      --fs-h3: 17px;
      --fs-body: 17px;
      --fs-meta: 13px;

      --radius-card: 18px;
      --radius-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 28px;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    .pad     { padding-inline: 20px; }
    .stack   { display: flex; flex-direction: column; gap: 14px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* ========== 头部：巨型标题 ========== */
    .hero-header {
      padding: 8px 20px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--fg);
      line-height: 1;
    }
    .hero-subtitle {
      font-family: var(--font-body);
      font-size: var(--fs-meta);
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.01em;
    }

    .header .icon-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: var(--fg);
      cursor: pointer;
      transition: background 140ms, border-color 140ms, transform 140ms;
      text-decoration: none;
    }
    .header .icon-btn::after { content: ''; position: absolute; inset: -6px; }
    .header .icon-btn:hover { background: var(--fg-soft); border-color: var(--fg-2); }
    .header .icon-btn:active { transform: scale(0.96); }
    .header .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
    .header .icon-btn i { font-size: 22px; line-height: 1; }

    /* ========== 照片区：更大胆的视觉 ========== */
    .photo-area {
      margin: 0 20px 20px;
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      background: var(--surface);
      border: 2px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 140ms, background 140ms;
      color: var(--muted);
    }
    .photo-area:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .photo-area i {
      font-size: 40px;
      line-height: 1;
      opacity: 0.7;
      transition: transform 140ms;
    }
    .photo-area:hover i { transform: scale(1.08); }
    .photo-area span {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ========== 表单区块：左边框强调 ========== */
    .form-section {
      margin: 0 20px 20px;
    }
    .form-section-title {
      font-family: var(--font-display);
      font-size: var(--fs-h3);
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.005em;
      margin: 0 0 12px;
      padding-left: 12px;
      border-left: 4px solid var(--accent-strong);
    }
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-field label {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      color: var(--fg-2);
      letter-spacing: 0.01em;
    }
    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      padding: 14px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: var(--fs-body);
      outline: none;
      transition: border-color 140ms, box-shadow 140ms;
    }
    .form-field input::placeholder,
    .form-field textarea::placeholder { color: var(--muted); }
    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .form-field textarea {
      min-height: 88px;
      resize: vertical;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--fg-2);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 140ms;
    }
    .chip:hover { border-color: var(--fg-2); }
    .chip.active {
      background: var(--fg);
      color: var(--surface);
      border-color: var(--fg);
    }

    /* ========== 底部操作区 ========== */
    .action-bar {
      margin: 0 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 16px 20px;
      background: var(--accent-strong);
      color: #fff;
      border: 0;
      border-radius: var(--radius-card);
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.005em;
      cursor: pointer;
      transition: transform 140ms, background 140ms, box-shadow 140ms;
      box-shadow: 0 4px 14px color-mix(in oklab, var(--accent) 28%, transparent);
    }
    .btn-primary:hover { background: color-mix(in oklab, var(--accent-strong), black 5%); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      background: transparent;
      color: var(--fg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 140ms, border-color 140ms;
    }
    .btn-secondary:hover { background: var(--fg-soft); border-color: var(--fg-2); }

    .hint {
      text-align: center;
      font-family: var(--font-mono);
      font-size: var(--fs-meta);
      color: var(--muted);
      margin: 0;
    }

    /* ========== 深色模式 ========== */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0c;
        --surface: #1c1c1e;
        --fg: #f5f5f7;
        --fg-2: #d1d1d6;
        --muted: #98989d;
        --border: #2c2c2e;
        --accent-soft: color-mix(in oklab, var(--accent) 22%, transparent);
        --fg-soft: color-mix(in oklab, #fff 8%, transparent);
      }
      .form-field input,
      .form-field select,
      .form-field textarea { background: #0c0c0e; color: var(--fg); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>记得吃药</strong> / 添加药品</div>
    <div class="device">
      <div class="island"></div>
      <div class="btn-rail left-1"></div>
      <div class="btn-rail left-2"></div>
      <div class="btn-rail left-3"></div>
      <div class="btn-rail right-1"></div>

      <div class="screen">
        <div class="statusbar">
          <span>9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11"><path d="M1 4.5C1 3.67 1.67 3 2.5 3h1C4.33 3 5 3.67 5 4.5v5c0 .83-.67 1.5-1.5 1.5h-1C1.67 11 1 10.33 1 9.5v-5zM6 3h2.5C9.33 3 10 3.67 10 4.5v5c0 .83-.67 1.5-1.5 1.5H6V3zm3 7.5c.83 0 1.5-.67 1.5-1.5v-5c0-.83.67-1.5 1.5-1.5h1.5C14.33 3 15 3.67 15 4.5v5c0 .83-.67 1.5-1.5 1.5H9z"/></svg>
            <svg class="battery" viewBox="0 0 25 11"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="2" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M22 3v5c0 .83-.67 1.5-1.5 1.5h.67c.83 0 1.5-.67 1.5-1.5V4.5c0-.83-.67-1.5-1.5-1.5H22z"/></svg>
          </span>
        </div>

        <div class="content">
          <!-- 头部：返回 + 巨型标题 -->
          <div class="hero-header">
            <div>
              <h1 class="hero-title">添加药品</h1>
              <p class="hero-subtitle">录入新药品信息</p>
            </div>
            <button class="header .icon-btn" aria-label="保存" onclick="alert('保存药品')" style="width:44px;height:44px;border-radius:999px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--fg);cursor:pointer;transition:background 140ms, border-color 140ms, transform 140ms;">
              <i class="hgi-stroke hgi-checkmark-circle-01" aria-hidden="true" style="font-size:22px;line-height:1;"></i>
            </button>
          </div>

          <!-- 照片识别区 -->
          <div class="photo-area" role="button" tabindex="0" aria-label="拍照或上传药盒照片">
            <i class="hgi-stroke hgi-camera-01" aria-hidden="true"></i>
            <span>拍照识别药盒</span>
          </div>

          <!-- 基本信息 -->
          <div class="form-section">
            <h2 class="form-section-title">基本信息</h2>
            <div class="form-card">
              <div class="form-field">
                <label for="med-name">药品名称</label>
                <input type="text" id="med-name" placeholder="例如：阿托伐他汀" />
              </div>
              <div class="form-row">
                <div class="form-field">
                  <label for="med-dose">规格</label>
                  <input type="text" id="med-dose" placeholder="例如：10mg/片" />
                </div>
                <div class="form-field">
                  <label for="med-form">剂型</label>
                  <select id="med-form">
                    <option>片</option>
                    <option>胶囊</option>
                    <option>液体</option>
                    <option>注射剂</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-field">
                  <label for="med-unit">单位</label>
                  <select id="med-unit">
                    <option>片</option>
                    <option>粒</option>
                    <option>ml</option>
                    <option>袋</option>
                  </select>
                </div>
                <div class="form-field">
                  <label for="med-use">用途</label>
                  <input type="text" id="med-use" placeholder="例如：降胆固醇" />
                </div>
              </div>
            </div>
          </div>

          <!-- 库存信息 -->
          <div class="form-section">
            <h2 class="form-section-title">库存管理</h2>
            <div class="form-card">
              <div class="form-row">
                <div class="form-field">
                  <label for="med-stock">当前库存</label>
                  <input type="number" id="med-stock" placeholder="23" />
                </div>
                <div class="form-field">
                  <label for="med-total">总库存</label>
                  <input type="number" id="med-total" placeholder="30" />
                </div>
              </div>
              <div class="form-field">
                <label for="med-expiry">有效期</label>
                <input type="date" id="med-expiry" />
              </div>
            </div>
          </div>

          <!-- 其他信息 -->
          <div class="form-section">
            <h2 class="form-section-title">其他信息</h2>
            <div class="form-card">
              <div class="form-field">
                <label for="med-note">备注</label>
                <textarea id="med-note" placeholder="服用注意事项、过敏信息等"></textarea>
              </div>
              <div class="form-field">
                <label>服用对象</label>
                <div class="chip-row">
                  <button class="chip active" type="button">我</button>
                  <button class="chip" type="button">妈妈</button>
                  <button class="chip" type="button">爸爸</button>
                  <button class="chip" type="button">老人</button>
                </div>
              </div>
              <div class="form-field">
                <label>是否处方药</label>
                <div class="chip-row">
                  <button class="chip active" type="button">处方药</button>
                  <button class="chip" type="button">非处方药</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 操作按钮 -->
          <div class="action-bar">
            <button class="btn-primary" onclick="alert('已保存')">保存药品</button>
            <button class="btn-secondary" onclick="history.length ? history.back() : (location.href='medications.html')">取消</button>
            <p class="hint">保存后可继续设置服药提醒</p>
          </div>
        </div>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const siblings = chip.parentElement.querySelectorAll('.chip');
        siblings.forEach(s => s.classList.remove('active'));
        chip.classList.add('active');
      });
    });
  </script>
</body>
</html>
