<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>记得吃药 · 我的</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
  <style>
    :root {
      --bg: #f0f4f2;
      --surface: #ffffff;
      --fg: #0f172a;
      --fg-2: #334155;
      --muted: #64748b;
      --border: #e2e8e5;
      --accent: #0d9488;
      --accent-soft: color-mix(in oklab, var(--accent) 14%, transparent);
      --fg-soft: color-mix(in oklab, var(--fg) 6%, transparent);
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --success-strong: #047857;
      --warn-strong: #b45309;
      --font-display: Inter, system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
      --fs-h1: 28px;
      --fs-h2: 22px;
      --fs-h3: 17px;
      --fs-body: 17px;
      --fs-meta: 13px;
      --radius-card: 18px;
      --radius-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background:
        linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 28px;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    .pad     { padding-inline: 20px; }
    .stack   { display: flex; flex-direction: column; gap: 10px; }
    .row     { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .grid-2  { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3  { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    .header {
      padding: 8px 20px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0;
    }
    .icon-btn {
      position: relative;
      width: 36px; height: 36px;
      padding: 0;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--fg);
      cursor: pointer;
    }
    /* 视觉 36px，热区扩到 44px */
    .icon-btn::after { content: ''; position: absolute; inset: -4px; }
    .icon-btn i { font-size: 18px; line-height: 1; }
    .icon-btn:hover { background: var(--fg-soft); border-color: var(--border); }
    .icon-btn:active { transform: scale(0.96); }
    .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }

    .greeting {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }

    .h2  { font-family: var(--font-display); font-size: var(--fs-h2); letter-spacing: -0.015em; line-height: 1.2; margin: 0; }
    .h3  { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; margin: 0; }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 14px 16px;
    }
    .card.accent {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .card.accent .meta { color: rgba(255,255,255,0.72); }
    .card.flat { background: transparent; border: 0; padding: 10px 0; border-top: 1px solid var(--border); border-radius: 0; }
    .card.flat:first-child { border-top: 0; padding-top: 0; }

    .avatar {
      border-radius: 50%;
      background:
        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),
        var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--muted);
      flex-shrink: 0;
    }
    .avatar svg {
      width: 54%; height: 54%;
      stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      opacity: 0.9;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: var(--radius-pill);
      font-size: 12px; font-weight: 500; letter-spacing: 0.01em;
      flex-shrink: 0;
    }
    .badge.ok   { background: color-mix(in oklab, var(--success) 12%, transparent); color: var(--success-strong); }
    .badge.warn { background: color-mix(in oklab, var(--warn) 14%, transparent); color: var(--warn-strong); }

    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(var(--tabs, 4), 1fr);
      padding: 8px 8px 0;
      border-top: 1px solid var(--border);
      background: color-mix(in oklab, var(--surface) 92%, transparent);
      backdrop-filter: blur(20px);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 0;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.02em;
      text-decoration: none;
    }
    .tab.active { color: var(--accent); }
    .tab i { font-size: 22px; line-height: 1; }
    .tab.active i { font-weight: 400; }
    .tab.active svg { stroke-width: 2; }

    .btn-primary {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
      cursor: pointer;
    }
    .btn-secondary {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
    }

    .ph-img {
      background:
        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      aspect-ratio: 4 / 3;
      display: grid; place-items: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .ph-img.square { aspect-ratio: 1 / 1; }
    .ph-img.wide   { aspect-ratio: 16 / 9; }

    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 14px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 140ms, border-color 140ms;
    }
    .pill.active { background: var(--accent); color: #fff; }
    .tag {
      display: inline-flex;
      padding: 6px 14px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }

    .progress { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

    .section-title {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: var(--fs-h3);
      font-weight: 600;
      letter-spacing: -0.005em;
      color: var(--fg-2);
    }

    .stat-card {
      text-align: center;
    }
    .stat-card .num {
      font-size: 22px;
      letter-spacing: -0.02em;
      font-weight: 600;
    }
    .stat-card .meta {
      margin-top: 4px;
    }
  
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0c;
        --surface: #1c1c1e;
        --fg: #f5f5f7;
        --fg-2: #ebebf0;
        --muted: #98989d;
        --border: #2c2c2e;
        --accent-soft: color-mix(in oklab, var(--accent) 18%, transparent);
        --fg-soft: color-mix(in oklab, var(--fg) 12%, transparent);
      }
      .device { background: linear-gradient(160deg, #1a1a1c 0%, #0e0e10 50%, #050507 100%); }
      .statusbar { color: var(--fg); }
      .statusbar svg { fill: var(--fg); }
      .home-indicator::after { background: var(--fg); opacity: 0.5; }
      .ph-img { background: linear-gradient(135deg, var(--accent-soft), var(--fg-soft)), var(--surface); }
      .med-thumb { background: linear-gradient(135deg, var(--accent-soft), var(--fg-soft)), var(--surface); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>记得吃药</strong> · 我的</div>

    <div class="device" data-od-id="device">
      <span class="btn-rail left-1"  aria-hidden></span>
      <span class="btn-rail left-2"  aria-hidden></span>
      <span class="btn-rail left-3"  aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island"           aria-hidden></span>

      <div class="screen">
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden>
              <rect x="0"  y="7" width="3" height="4" rx="0.6"/>
              <rect x="4"  y="5" width="3" height="6" rx="0.6"/>
              <rect x="8"  y="3" width="3" height="8" rx="0.6"/>
              <rect x="12" y="0" width="3" height="11" rx="0.6"/>
            </svg>
            <svg viewBox="0 0 17 11" aria-hidden>
              <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
            </svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden>
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
              <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/>
              <rect x="2" y="2" width="18" height="7" rx="1.4"/>
            </svg>
          </span>
        </div>

        <main class="content" data-od-id="content">
          <div class="header" data-od-id="header">
            <div>
              <p class="greeting">账户</p>
              <h1>我的</h1>
            </div>
            <button class="icon-btn" aria-label="设置" onclick="location.href='settings.html'">
              <i class="hgi-stroke hgi-account-setting-01" aria-hidden="true"></i>
            </button>
          </div>

          <section class="pad" data-od-id="profile" style="margin-bottom: 10px;">
            <div class="card" style="display: flex; gap: 14px; align-items: center;">
              <div class="avatar" style="width: 64px; height: 64px;" data-od-id="avatar-self"><i class="hgi-stroke hgi-profile" aria-hidden="true" style="font-size: 32px; line-height: 1;"></i></div>
              <div style="flex: 1; min-width: 0;">
                <div style="font-weight: 600; font-size: 18px;">小明</div>
                <div class="meta" style="margin-top: 4px;">本人 · 主要使用者</div>
                <div class="row" style="margin-top: 10px; gap: 8px;">
                  <button class="btn-secondary" style="flex: 1; min-height: 38px; font-size: 13px;" onclick="alert('编辑资料')">编辑资料</button>
                </div>
              </div>
            </div>
          </section>

          <section class="pad" data-od-id="stats" style="margin-bottom: 10px;">
            <p class="section-title">本周概览</p>
            <div class="grid-3">
              <div class="card stat-card"><div class="num">92%</div><div class="meta">服药率</div></div>
              <div class="card stat-card"><div class="num">18</div><div class="meta">按时</div></div>
              <div class="card stat-card"><div class="num">1</div><div class="meta">漏服</div></div>
            </div>
          </section>

          <section class="pad" data-od-id="family" style="margin-bottom: 10px;">
            <div class="row-between" style="margin-bottom: 8px;">
              <p class="section-title" style="margin: 0;">家庭成员</p>
              <button class="icon-btn" aria-label="本地添加家庭成员" onclick="alert('本地添加家庭成员')">
                <i class="hgi-stroke hgi-add-01" aria-hidden="true"></i>
              </button>
            </div>
            <div class="stack" style="gap: 2px;">
              <div class="card flat row-between" style="padding: 12px 0;">
                <div class="row">
                  <div class="avatar" style="width: 36px; height: 36px;"><i class="hgi-stroke hgi-profile" aria-hidden="true" style="font-size: 18px; line-height: 1;"></i></div>
                  <div>
                    <div style="font-weight: 500; font-size: 14px;">我</div>
                    <div class="meta">主要使用者</div>
                  </div>
                </div>
                <span class="badge ok" style="font-size: 10px;">本人</span>
              </div>
              <div class="card flat row-between" style="padding: 12px 0;">
                <div class="row">
                  <div class="avatar" style="width: 36px; height: 36px;"><i class="hgi-stroke hgi-profile" aria-hidden="true" style="font-size: 18px; line-height: 1;"></i></div>
                  <div>
                    <div style="font-weight: 500; font-size: 14px;">妈妈</div>
                    <div class="meta">被照护人</div>
                  </div>
                </div>
                <span class="badge warn" style="font-size: 10px;">待关注</span>
              </div>
              <div class="card flat row-between" style="padding: 12px 0;">
                <div class="row">
                  <div class="avatar" style="width: 36px; height: 36px;"><i class="hgi-stroke hgi-profile" aria-hidden="true" style="font-size: 18px; line-height: 1;"></i></div>
                  <div>
                    <div style="font-weight: 500; font-size: 14px;">爸爸</div>
                    <div class="meta">被照护人</div>
                  </div>
                </div>
                <span class="badge ok" style="font-size: 10px;">正常</span>
              </div>
            </div>
          </section>

          <section class="pad" data-od-id="cta" style="padding-top: 4px; padding-bottom: 16px;">
            <button class="btn-secondary" style="color: var(--danger); border-color: #fecaca;" onclick="alert('退出登录')">退出登录</button>
          </section>
        </main>

        <nav class="tabbar" style="--tabs: 4;" data-od-id="tabbar">
          <a class="tab" href="today.html">
            <i class="hgi-stroke hgi-home-01" aria-hidden="true"></i>
            今天
          </a>
          <a class="tab" href="medications.html">
            <i class="hgi-stroke hgi-book-open-01" aria-hidden="true"></i>
            药品库
          </a>
          <a class="tab" href="add-medication.html">
            <i class="hgi-stroke hgi-add-01" aria-hidden="true"></i>
            添加
          </a>
          <a class="tab active" href="#">
            <i class="hgi-stroke hgi-profile" aria-hidden="true"></i>
            我的
          </a>
        </nav>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const siblings = chip.parentElement.querySelectorAll('.chip');
        siblings.forEach(s => s.classList.remove('active'));
        chip.classList.add('active');
      });
    });
  </script>
</body>
</html>
