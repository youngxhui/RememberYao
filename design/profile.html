<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>记得吃药 · 我的</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
  <style>
    :root {
      --bg: #f0f4f2;
      --surface: #ffffff;
      --fg: #0f172a;
      --fg-2: #334155;
      --muted: #64748b;
      --border: #e2e8e5;
      --accent: #0d9488;
      --accent-strong: #0f766e;
      --accent-soft: color-mix(in oklab, var(--accent) 14%, transparent);
      --fg-soft: color-mix(in oklab, var(--fg) 6%, transparent);
      --success: #10b981;
      --success-strong: #047857;
      --warn: #f59e0b;
      --warn-strong: #b45309;
      --danger: #ef4444;
      --danger-strong: #dc2626;

      --font-display: Inter, system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;

      --fs-h1: 32px;
      --fs-h2: 22px;
      --fs-h3: 17px;
      --fs-body: 17px;
      --fs-meta: 13px;

      --radius-card: 18px;
      --radius-pill: 999px;

      /* ── Mini Archive 收藏夹（主题青绿 + 米白纸说明书） ── */
      --archive-cover-top: #4cc9b9;
      --archive-cover-bottom: #0d9488;
      --archive-tab: #2bb0a2;
      --archive-back: #0f766e;
      --archive-ink: #06302b;
      --archive-ink-muted: #3f7d74;
      --archive-line: rgba(6, 48, 43, 0.16);
      --archive-paper-top: #f7e7bd;
      --archive-paper-bottom: #efd9a4;
      --archive-shadow: rgba(13, 148, 136, 0.3);
      --archive-shadow-strong: rgba(13, 148, 136, 0.42);
      /* 邮票是“实物”：米白纸 + 深色印刷，不随主题变 */
      --archive-stamp-bg: #fffdf4;
      --archive-stamp-ink: #4a3417;
      --archive-stamp-muted: #8a7440;
      --archive-stamp-edge: rgba(74, 52, 23, 0.32);
      --archive-art-top: #17b8a6;
      --archive-art-bottom: #0c7d70;
      --archive-denom: #e2642a;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 28px;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    .pad     { padding-inline: 20px; }
    .stack   { display: flex; flex-direction: column; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* ========== 头部 ========== */
    .hero-header {
      padding: 8px 20px 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--fg);
      line-height: 1;
    }
    .hero-subtitle {
      font-family: var(--font-body);
      font-size: var(--fs-meta);
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.01em;
    }

    .header .icon-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: var(--fg);
      cursor: pointer;
      transition: background 140ms, border-color 140ms, transform 140ms;
      text-decoration: none;
    }
    .header .icon-btn::after { content: ''; position: absolute; inset: -6px; }
    .header .icon-btn:hover { background: var(--fg-soft); border-color: var(--fg-2); }
    .header .icon-btn:active { transform: scale(0.96); }
    .header .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
    .header .icon-btn i { font-size: 22px; line-height: 1; }

    /* ========== Mini Archive：水平列表（文件夹 + 药物说明书） ========== */
    /* 闭合=居中文件夹；点按→右滑进入列表，文件夹退到最左只露一角；
       在说明书1 继续右滑→说明书收回文件夹（合上） */
    .archive {
      /* 卡片几何：小说明书的飞行位移按节距 × 索引计算，与布局同源 */
      --card-w: 230px;
      --card-gap: 16px;
      --pitch: calc(var(--card-w) + var(--card-gap));
      padding: 10px 0 4px;
    }
    .archive-scroll {
      display: flex;
      align-items: center;
      gap: var(--card-gap);
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x proximity;
      padding: 30px calc((100% - var(--card-w)) / 2) 34px;
      scrollbar-width: none;
    }
    .archive-scroll::-webkit-scrollbar { display: none; }
    .archive-card {
      position: relative;
      z-index: 2;
      flex: 0 0 var(--card-w);
      scroll-snap-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 文件夹（列表第 1 项） */
    .card-folder {
      position: relative;
      width: 210px;
      height: 300px;
      cursor: pointer;
      transition: transform 200ms ease;
    }
    .card-folder:active { transform: scale(0.97); }
    .folder-back {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      background: linear-gradient(160deg, var(--archive-tab), var(--archive-back));
      box-shadow: 0 16px 30px -16px var(--archive-shadow);
    }
    .folder-front {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 22px;
      border-radius: 26px;
      /* 磨砂半透明封皮：透过它能隐约看到里面的说明书 */
      background: linear-gradient(
        160deg,
        color-mix(in oklab, var(--archive-cover-top) 55%, transparent),
        color-mix(in oklab, var(--archive-cover-bottom) 62%, transparent)
      );
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      box-shadow:
        0 26px 48px -14px var(--archive-shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.22);
      z-index: 3;
      transform-origin: left center;
      transition: transform 1250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .folder-front::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.22),
        transparent 46%
      );
      border-radius: inherit;
      pointer-events: none;
    }
    .folder-front > * { position: relative; }

    .folder-title {
      font-family: var(--font-display);
      font-size: 27px;
      font-weight: 800;
      color: var(--archive-ink);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .folder-sub {
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--archive-ink-muted);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .folder-lines {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .folder-line {
      height: 3px;
      border-radius: 2px;
      background: var(--archive-line);
    }
    .folder-line:nth-child(1) { width: 100%; }
    .folder-line:nth-child(2) { width: 84%; }
    .folder-line:nth-child(3) { width: 92%; }

    /* ── 文件夹内的说明书：盒样式与真实说明书完全共用（见下方 .leaflet, .mini-leaf），
       闭合时整体缩小，打开时放大飞入列表卡位 ── */
    .folder-stack {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    /* 闭合：小说明书缩到 64.76%，按索引递增偏移形成“厚沓”层叠；
       扇形幅度随数量收缩（--step），3 张时与原设计一致，10 张时自动收紧 */
    .mini-leaf {
      --step: min(1, 3 / var(--n, 3));
      transform:
        translate(
          calc(-7px + var(--i) * 6px * var(--step)),
          calc(-6px + var(--i) * 7px * var(--step))
        )
        rotate(calc(-4deg + var(--i) * 3.5deg * var(--step)))
        scale(0.6476);
    }

    /* 悬停（未打开）：封皮翘起一点，说明书探出边角 */
    .archive:not(.is-open) .card-folder:hover .folder-front {
      transform: perspective(1500px) rotateY(-16deg);
    }
    .archive:not(.is-open) .card-folder:hover .mini-leaf {
      transform:
        translate(
          calc(-11px + var(--i) * 10px * var(--step)),
          calc(-10px + var(--i) * 8px * var(--step))
        )
        rotate(calc(-6deg + var(--i) * 5deg * var(--step)))
        scale(0.72);
    }

    /* 打开：文件夹整体缓慢左移；封皮绕左侧翻开，内部小说明书依次放大、
       飞入水平列表对应的卡位，与真正的说明书交叉淡入 */
    .archive.is-open .folder-front {
      transform: perspective(1500px) rotateY(-58deg);
      /* 封皮转开后磨砂不可见，去掉 backdrop-filter 避免每帧重采样产生残影 */
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    /* 打开：第 i 张飞到第 i 个列表卡位；起飞顺序按堆叠层序反转——
       最上层（--i 最大）先飞，其下依次跟进，像从沓子上面一张张抽取。
       双重限速：① 按距离配速，时长 = 1200 + i×140ms，距离越远飞得越久，
       平均速度一律压在 ≤1000 px/s；② 缓动峰值斜率从 4.35 降到 ~2.5，
       起步瞬时速度不再爆冲。起飞延迟用 min() 封顶，头 3 张错峰 */
    .archive.is-open .mini-leaf {
      opacity: 0;
      transition:
        transform calc(1200ms + var(--i) * 140ms) cubic-bezier(0.3, 0.4, 0.2, 1),
        opacity 300ms ease
          calc(1200ms + var(--i) * 140ms + min(var(--n, 3) - 1 - var(--i), 2) * 100ms);
    }
    .archive.is-open .mini-leaf {
      transform: translate(calc(var(--pitch) * (var(--i) + 1)), 0) rotate(0deg) scale(1);
      transition-delay:
        calc(120ms + min(var(--n, 3) - 1 - var(--i), 2) * 120ms),
        calc(1200ms + var(--i) * 140ms + min(var(--n, 3) - 1 - var(--i), 2) * 100ms);
    }

    /* 减弱动态：飞行与延迟一并归零。注意必须写在基础规则之后或抬高特异性，
       否则会被 .mini-leaf 的 transition 简写覆盖（旧版即因此失效） */
    @media (prefers-reduced-motion: reduce) {
      .folder-front, .mini-leaf, .leaflet,
      .archive.is-open .mini-leaf, .archive.is-open .archive-card .leaflet {
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;
      }
    }

    /* ── 药物说明书：列表项与文件夹内飞行卡片共用同一套盒样式 ── */
    .leaflet, .mini-leaf {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 210px;
      height: 268px;
      padding: 15px 13px 10px;
      background: var(--archive-stamp-bg);
      border-radius: 10px;
      box-shadow: 0 10px 22px -10px rgba(60, 40, 10, 0.4);
    }
    .leaflet {
      opacity: 0;
      will-change: opacity;
      transition: opacity 420ms ease;
    }
    /* 飞行卡片：与列表项同尺寸，闭合时整体缩到 64.76%（≈136px 宽），
       打开时放大到 100% 飞入卡位，落点与列表项像素级一致 */
    .mini-leaf {
      position: absolute;
      top: 50%;
      left: 50%;
      margin: -134px 0 0 -105px;
      will-change: transform, opacity;
      /* 合上与打开严格对称：同样的按距离配速（1200 + i×140ms）、
         同样的温和缓动与封顶错峰，小说明书依次从卡位飞回文件夹，
         到位前淡入。悬停探出也复用这条过渡，因此起步同样轻快 */
      transition:
        transform calc(1200ms + var(--i) * 140ms) cubic-bezier(0.3, 0.4, 0.2, 1),
        opacity 300ms ease;
      transition-delay:
        calc(120ms + min(var(--i), 2) * 120ms),
        calc(120ms + min(var(--i), 2) * 120ms);
    }
    .archive.is-open .leaflet {
      opacity: 1;
    }
    /* 淡入起点 = 起飞延迟 + 各自飞行时长 − 270ms（落位前 270ms 开始、
       420ms 淡入在落位后 150ms 收尾，与小说明书淡出交叉）；
       顺序同样反转，min() 封顶在倒数第 3 张 */
    .archive.is-open .archive-card .leaflet {
      transition-delay: calc(1050ms + var(--i) * 140ms + min(var(--n, 3) - 1 - var(--i), 2) * 120ms);
    }
    /* 顶部一道色条，暗示“折叠的说明书” */
    .leaflet::before, .mini-leaf::before {
      content: "";
      position: absolute;
      top: 0;
      left: 13px;
      right: 13px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: var(--archive-art-top);
      opacity: 0.85;
    }
    .leaflet-head {
      padding-bottom: 9px;
      border-bottom: 1px solid var(--archive-stamp-edge);
    }
    .leaflet-name {
      margin-top: 8px;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      color: var(--archive-stamp-ink);
      letter-spacing: -0.01em;
    }
    .leaflet-sub {
      margin-top: 3px;
      font-family: var(--font-body);
      font-size: 8px;
      color: var(--archive-stamp-muted);
    }
    .leaflet-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: space-evenly;
      padding-top: 9px;
    }
    .leaflet-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .leaflet-row .k {
      flex-shrink: 0;
      width: 54px;
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--archive-stamp-ink);
    }
    /* 真实文本代替占位色条；超长药名条目省略号兜底，不撑破 210px 卡宽 */
    .leaflet-row .v {
      flex: 1;
      min-width: 0;
      font-family: var(--font-body);
      font-size: 8.5px;
      line-height: 1.3;
      color: var(--archive-stamp-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .leaflet-foot {
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 7px;
      letter-spacing: 0.02em;
      color: var(--archive-stamp-muted);
      opacity: 0.85;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .archive-caption {
      margin-top: 4px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    /* ========== 底部导航 ========== */
    .tabbar {
      flex: 0 0 84px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 10px;
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 16px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: color 140ms;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .tab i { font-size: 24px; line-height: 1; transition: transform 140ms; }
    .tab:hover { color: var(--fg-2); }
    .tab:hover i { transform: translateY(-1px); }
    .tab.active { color: var(--accent-strong); }
    .tab.active i { transform: translateY(-1px); }

    /* ========== 深色模式 ========== */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0c;
        --surface: #1c1c1e;
        --fg: #f5f5f7;
        --fg-2: #d1d1d6;
        --muted: #98989d;
        --border: #2c2c2e;
        --accent-soft: color-mix(in oklab, var(--accent) 22%, transparent);
        --fg-soft: color-mix(in oklab, #fff 8%, transparent);

        /* Mini Archive 深色青绿变体（邮票纸/印刷色不随主题变） */
        --archive-cover-top: #14857a;
        --archive-cover-bottom: #0f766e;
        --archive-tab: #0e6b62;
        --archive-back: #0b544e;
        --archive-ink: #d9f2ee;
        --archive-ink-muted: #8fc9c0;
        --archive-line: rgba(217, 242, 238, 0.16);
        --archive-paper-top: #2b2416;
        --archive-paper-bottom: #221b10;
        --archive-shadow: rgba(0, 0, 0, 0.5);
        --archive-shadow-strong: rgba(0, 0, 0, 0.62);
      }
    }

    /* ========== 统计区块 ========== */
    .stats-section {
      padding: 0 20px;
      margin-top: 4px;
    }
    .stats-title {
      font-family: var(--font-display);
      font-size: var(--fs-h3);
      font-weight: 700;
      color: var(--fg);
      margin: 0 0 12px;
      letter-spacing: -0.005em;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);

      color: var(--fg);

    /* ========== 菜单列表 ========== */

    /* ========== 按钮 ========== */

    .btn-secondary:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }

  <script>
    const archive = document.getElementById('archive');
    const pager = document.getElementById('archivePager');
    const folder = document.getElementById('folderCard');
    const folderBack = folder.querySelector('.folder-back');
    const folderFront = folder.querySelector('.folder-front');
    const caption = document.getElementById('archiveCaption');

    // 药品数据：增删药品只改这里。文件夹内的小说明书和水平列表的说明书
    // 都是这份数据的两个投影，由脚本生成，数量不限。
    // rows 为正文条目（前四条通用 + 每药一条特色项），
    // approval / maker 是真实的药品文号与企业格式，仅编号为设计示例
    const MEDS = [
      {

        approval: '国药准字H20051418',

        ],
      },
      {
        name: '阿司匹林肠溶片',
        approval: '国药准字J20130078',
        maker: '拜耳医药保健',
        rows: [
          ['成份', '乙酰水杨酸'],
          ['适应症', '抑制血小板聚集'],
          ['规格', '100mg × 30片'],
          ['用法用量', '每日1次 100mg'],
          ['不良反应', '胃部不适、出血'],
        ],
      },
      {
        name: '苯磺酸氨氯地平片',
        approval: '国药准字H10950224',
        maker: '辉瑞制药',
        rows: [
          ['成份', '苯磺酸氨氯地平'],
          ['适应症', '高血压、心绞痛'],
          ['规格', '5mg × 7片'],
          ['用法用量', '每日1次 5mg'],
          ['药物相互作用', '慎与CYP3A4抑制剂同用'],
        ],
      },
      {
        name: '硝苯地平缓释片',
        approval: '国药准字H10910052',
        maker: '青岛黄海制药',
        rows: [
          ['成份', '硝苯地平'],
          ['适应症', '高血压、冠心病'],
          ['规格', '20mg × 20片'],
          ['用法用量', '整片吞服 每日1次'],
          ['注意事项', '不可嚼碎或掰开'],
        ],
      },
      {
        name: '奥美拉唑肠溶胶囊',
        approval: '国药准字H20056577',
        maker: '阿斯利康制药',
        rows: [
          ['成份', '奥美拉唑'],
          ['适应症', '胃溃疡、反流性食管炎'],
          ['规格', '20mg × 14粒'],

          ['禁忌', '过敏者禁用'],
        ],
      },
      {

        ],
      },
      {
        name: '瑞舒伐他汀钙片',
        approval: '国药准字H20080670',
        maker: '阿斯利康制药',
        rows: [
          ['成份', '瑞舒伐他汀钙'],
          ['适应症', '高脂血症'],
          ['规格', '10mg × 7片'],
          ['用法用量', '每日1次 10mg'],
          ['药物相互作用', '忌与大环内酯类同服'],
        ],
      },
      {
        name: '氯沙坦钾片',
        approval: '国药准字H20000371',
        maker: '杭州默沙东制药',
        rows: [
          ['成份', '氯沙坦钾'],
          ['适应症', '原发性高血压'],
          ['规格', '50mg × 7片'],
          ['用法用量', '每日1次 50mg'],
          ['老年用药', '起始剂量减半'],
        ],
      },
      {
        name: '格列美脲片',
        approval: '国药准字H20010552',
        maker: '江苏万邦生化',
        rows: [
          ['成份', '格列美脲'],
          ['适应症', '2型糖尿病'],
          ['规格', '2mg × 15片'],
          ['用法用量', '早餐前服 2mg'],
          ['儿童用药', '18岁以下不推荐'],
        ],
      },
    ];

    function leafletHTML(med) {
      const rows = med.rows
        .map(
          ([k, v]) =>
            `<div class="leaflet-row"><span class="k">${k}</span><span class="v">${v}</span></div>`
        )
        .join('');
      return (
        '<div class="leaflet-head">' +
        `<div class="leaflet-name">${med.name}</div>` +
        '<div class="leaflet-sub">请仔细阅读并按说明使用</div>' +
        '</div>' +
        `<div class="leaflet-body">${rows}</div>` +
        `<div class="leaflet-foot">${med.approval} · ${med.maker}</div>`
      );
    }

    // 封皮下的小说明书：--i 驱动堆叠偏移、飞行位移和延迟；
    // --n 让堆叠扇形随数量自适应收缩（3 张时保持原样，10 张时收紧），
    // 也用于反转起飞顺序（最上层先飞）。挂在 .archive 上，
    // 让列表里的 .leaflet 淡入延迟也能取到同一个数量
    const stack = folder.querySelector('.folder-stack');
    archive.style.setProperty('--n', String(MEDS.length));
    stack.innerHTML = MEDS.map(
      (med, i) => `<div class="mini-leaf" style="--i:${i}">${leafletHTML(med)}</div>`
    ).join('');

    // 水平列表的说明书卡片：插在文件夹卡片之后，--i 驱动淡入延迟
    pager.insertAdjacentHTML(
      'beforeend',
      MEDS.map(
        (med, i) =>
          `<div class="archive-card" style="--i:${i}"><div class="leaflet">${leafletHTML(med)}</div></div>`
      ).join('')
    );

    const cards = Array.from(pager.querySelectorAll('.archive-card'));

    // 让某张卡居中到视口
    function centerOf(card) {
      const c = pager.getBoundingClientRect();
      const r = card.getBoundingClientRect();
      return pager.scrollLeft + (r.left + r.width / 2) - (c.left + c.width / 2);
    }

    // 与手动左滑完全一致：只发起浏览器原生平滑滚动，不自造缓动。
    // 开合状态、封皮/卡片动画统一由 sync() 按滚动进度驱动，
    // 点按和滑动因此走同一条链路、观感一致
    function animateScrollTo(target) {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      pager.scrollTo({ left: target, behavior: reduce ? 'auto' : 'smooth' });
    }

    // 点按文件夹：闭合→平滑滚到说明书1（展开）；已展开→平滑滚回文件夹（合上）
    folder.addEventListener('click', () => {
      if (!cards[1]) return;
      const open = archive.classList.contains('is-open');
      animateScrollTo(open ? 0 : centerOf(cards[1]));
    });

    // 依据滚动进度同步：开合状态、提示文案、封皮“退到一边”的变暗
    //（只淡化封皮和底板，不影响正在放大飞入列表的小说明书）
    function sync() {
      const open = pager.scrollLeft > 40;
      archive.classList.toggle('is-open', open);
      if (caption) caption.textContent = open ? '右滑回到文件夹合上' : '点按展开';
      const p = Math.min(1, Math.max(0, pager.scrollLeft / 260));
      const dim = String(1 - 0.35 * p);
      folderBack.style.opacity = p <= 0.001 ? '' : dim;
      folderFront.style.opacity = p <= 0.001 ? '' : dim;
    }

    pager.addEventListener('scroll', () => window.requestAnimationFrame(sync));
    sync();
  </script>
