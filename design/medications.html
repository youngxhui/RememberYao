<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>记得吃药 · 药品库</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
  <style>
    :root {
      --bg: #f0f4f2;
      --surface: #ffffff;
      --fg: #0f172a;
      --fg-2: #334155;
      --muted: #64748b;
      --border: #e2e8e5;
      --accent: #0d9488;
      --accent-strong: #0f766e;
      --accent-soft: color-mix(in oklab, var(--accent) 14%, transparent);
      --fg-soft: color-mix(in oklab, var(--fg) 6%, transparent);
      --success: #10b981;
      --success-strong: #047857;
      --warn: #f59e0b;
      --warn-strong: #b45309;
      --danger: #ef4444;
      --danger-strong: #dc2626;

      --font-display: Inter, system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;

      --fs-h1: 32px;
      --fs-h2: 22px;
      --fs-h3: 17px;
      --fs-body: 17px;
      --fs-meta: 13px;

      --radius-card: 18px;
      --radius-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 28px;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    .pad     { padding-inline: 20px; }
    .stack   { display: flex; flex-direction: column; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* ========== 头部：巨型标题 + 计数徽章 ========== */
    .hero-header {
      padding: 8px 20px 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--fg);
      line-height: 1;
    }
    .hero-subtitle {
      font-family: var(--font-body);
      font-size: var(--fs-meta);
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.01em;
    }
    .hero-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background: var(--accent-strong);
      color: #fff;
      border-radius: var(--radius-pill);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 12px color-mix(in oklab, var(--accent) 30%, transparent);
    }
    .hero-badge i { font-size: 18px; line-height: 1; }

    .header .icon-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: var(--fg);
      cursor: pointer;
      transition: background 140ms, border-color 140ms, transform 140ms;
      text-decoration: none;
    }
    .header .icon-btn::after { content: ''; position: absolute; inset: -6px; }
    .header .icon-btn:hover { background: var(--fg-soft); border-color: var(--fg-2); }
    .header .icon-btn:active { transform: scale(0.96); }
    .header .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
    .header .icon-btn i { font-size: 22px; line-height: 1; }

    /* ========== 搜索栏 ========== */
    .search-bar {
      margin: 0 20px 16px;
      position: relative;
    }
    .search-bar input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      color: var(--fg);
      outline: none;
      transition: border-color 140ms, box-shadow 140ms;
    }
    .search-bar input::placeholder { color: var(--muted); }
    .search-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .search-bar .search-ico {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      pointer-events: none;
    }

    /* ========== 分类标签 ========== */
    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 20px 16px;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 140ms;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
    }
    .chip:hover { border-color: var(--fg-2); color: var(--fg-2); }
    .chip.active {
      background: var(--fg);
      color: var(--surface);
      border-color: var(--fg);
    }

    /* ========== 药品卡片：左边框色码 ========== */
    .med-list { display: flex; flex-direction: column; gap: 12px; padding: 0 20px; }

    .med-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 6px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
      cursor: pointer;
      transition: background 160ms, border-color 160ms, border-left-color 160ms;
    }
    .med-card:hover { background: var(--fg-soft); border-color: var(--fg-2); }
    .med-card[data-stock="ok"]      { border-left-color: var(--success-strong); }
    .med-card[data-stock="low"]     { border-left-color: var(--warn-strong); }
    .med-card[data-stock="critical"] { border-left-color: var(--danger-strong); }

    .med-thumb {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .med-thumb i { font-size: 24px; line-height: 1; }

    .med-info { flex: 1; min-width: 0; }
    .med-name {
      font-family: var(--font-display);
      font-size: var(--fs-h3);
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.005em;
      margin: 0 0 3px;
    }
    .med-meta {
      font-size: var(--fs-meta);
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .med-meta .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.5;
    }

    .stock-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .stock-pill i { font-size: 13px; line-height: 1; }
    .stock-pill.ok      { background: color-mix(in oklab, var(--success) 12%, transparent); color: var(--success-strong); }
    .stock-pill.low     { background: color-mix(in oklab, var(--warn) 12%, transparent); color: var(--warn-strong); }
    .stock-pill.critical { background: color-mix(in oklab, var(--danger) 12%, transparent); color: var(--danger-strong); }

    .med-actions {
      display: flex;
      gap: 4px;
    }
    .med-actions button {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-pill);
      background: var(--fg-soft);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 140ms;
    }
    .med-actions button:hover { background: var(--border); color: var(--fg); }
    .med-actions button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
    .med-actions button i { font-size: 16px; line-height: 1; }

    /* ========== 底部导航 ========== */
    .tabbar {
      flex: 0 0 84px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 10px;
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 16px;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: color 140ms;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .tab i { font-size: 24px; line-height: 1; transition: transform 140ms; }
    .tab:hover { color: var(--fg-2); }
    .tab:hover i { transform: translateY(-1px); }
    .tab.active { color: var(--accent-strong); }
    .tab.active i { transform: translateY(-1px); }

    /* ========== 空态 ========== */
    .empty-state {
      text-align: center;
      padding: 60px 40px;
      color: var(--muted);
    }
    .empty-state i {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 16px;
      opacity: 0.4;
    }
    .empty-state h3 {
      font-family: var(--font-display);
      font-size: var(--fs-h3);
      font-weight: 700;
      color: var(--fg-2);
      margin: 0 0 8px;
    }
    .empty-state p {
      font-size: var(--fs-meta);
      margin: 0;
    }

    /* ========== 深色模式 ========== */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0c;
        --surface: #1c1c1e;
        --fg: #f5f5f7;
        --fg-2: #d1d1d6;
        --muted: #98989d;
        --border: #2c2c2e;
        --accent-soft: color-mix(in oklab, var(--accent) 22%, transparent);
        --fg-soft: color-mix(in oklab, #fff 8%, transparent);
      }
      .search-bar input { color: var(--fg); }
      .search-bar input::placeholder { color: var(--muted); }
      .med-thumb { border-color: var(--border); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>记得吃药</strong> / 药品库</div>
    <div class="device">
      <div class="island"></div>
      <div class="btn-rail left-1"></div>
      <div class="btn-rail left-2"></div>
      <div class="btn-rail left-3"></div>
      <div class="btn-rail right-1"></div>

      <div class="screen">
        <div class="statusbar">
          <span>9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11"><path d="M1 4.5C1 3.67 1.67 3 2.5 3h1C4.33 3 5 3.67 5 4.5v5c0 .83-.67 1.5-1.5 1.5h-1C1.67 11 1 10.33 1 9.5v-5zM6 3h2.5C9.33 3 10 3.67 10 4.5v5c0 .83-.67 1.5-1.5 1.5H6V3zm3 7.5c.83 0 1.5-.67 1.5-1.5v-5c0-.83.67-1.5 1.5-1.5h1.5C14.33 3 15 3.67 15 4.5v5c0 .83-.67 1.5-1.5 1.5H9z"/></svg>
            <svg class="battery" viewBox="0 0 25 11"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="2" width="17" height="7" rx="1.5" fill="currentColor"/><path d="M22 3v5c0 .83-.67 1.5-1.5 1.5h.67c.83 0 1.5-.67 1.5-1.5V4.5c0-.83-.67-1.5-1.5-1.5H22z"/></svg>
          </span>
        </div>

        <div class="content">
          <!-- 头部：巨型标题 -->
          <div class="hero-header">
            <div>
              <h1 class="hero-title">药品库</h1>
              <p class="hero-subtitle">管理所有家庭药品</p>
            </div>
            <div class="hero-badge">
              <i class="hgi-stroke hgi-medicine-01" aria-hidden="true"></i>
              <span id="med-count">6 种</span>
            </div>
          </div>

          <!-- 搜索栏 -->
          <div class="search-bar">
            <span class="search-ico"><i class="hgi-stroke hgi-search-01" aria-hidden="true"></i></span>
            <input type="text" placeholder="搜索药品名称..." aria-label="搜索药品" />
          </div>

          <!-- 分类标签 -->
          <div class="chip-row">
            <span class="chip active" data-filter="all">全部</span>
            <span class="chip" data-filter="chronic">慢性病</span>
            <span class="chip" data-filter="acute">临时用药</span>
            <span class="chip" data-filter="supplement">保健品</span>
            <span class="chip" data-filter="low">库存不足</span>
          </div>

          <!-- 药品列表 -->
          <div class="med-list" id="med-list"></div>
        </div>

        <!-- 底部导航 -->
        <nav class="tabbar" aria-label="主导航">
          <a href="today.html" class="tab"><i class="hgi-stroke hgi-home-01" aria-hidden="true"></i>今天</a>
          <button class="tab active" aria-current="page"><i class="hgi-stroke hgi-book-open-01" aria-hidden="true"></i>药品库</button>
          <a href="profile.html" class="tab"><i class="hgi-stroke hgi-profile" aria-hidden="true"></i>我的</a>
        </nav>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <script>
    const MEDS = [
      { id: 'm1', name: '阿托伐他汀', dose: '20mg/每晚', stock: 8, total: 30, type: 'chronic', category: '慢性病' },
      { id: 'm2', name: '二甲双胍', dose: '500mg/每日两次', stock: 22, total: 60, type: 'chronic', category: '慢性病' },
      { id: 'm3', name: '硝苯地平', dose: '10mg/每日一次', stock: 3, total: 30, type: 'chronic', category: '慢性病' },
      { id: 'm4', name: '布洛芬', dose: '400mg/按需', stock: 12, total: 20, type: 'acute', category: '临时用药' },
      { id: 'm5', name: '维生素 D', dose: '1000IU/每日', stock: 45, total: 90, type: 'supplement', category: '保健品' },
      { id: 'm6', name: '阿司匹林', dose: '100mg/每日一次', stock: 5, total: 30, type: 'chronic', category: '慢性病' }
    ];

    function stockStatus(stock, total) {
      const ratio = stock / total;
      if (ratio <= 0.15) return 'critical';
      if (ratio <= 0.3) return 'low';
      return 'ok';
    }
    function stockLabel(status) {
      return { ok: '库存充足', low: '库存偏低', critical: '即将耗尽' }[status];
    }
    function stockIcon(status) {
      return { ok: 'hgi-checkmark-circle-01', low: 'hgi-alert-01', critical: 'hgi-alert-diamond' }[status];
    }

    function renderMeds(filter) {
      const list = document.getElementById('med-list');
      let items = MEDS;
      if (filter === 'low') items = items.filter(m => stockStatus(m.stock, m.total) !== 'ok');
      else if (filter !== 'all') items = items.filter(m => m.type === filter);

      if (items.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <i class="hgi-stroke hgi-bookmark" aria-hidden="true"></i>
            <h3>暂无药品</h3>
            <p>该分类下还没有添加药品</p>
          </div>`;
        return;
      }

      list.innerHTML = items.map(m => {
        const status = stockStatus(m.stock, m.total);
        const label = stockLabel(status);
        const icon = stockIcon(status);
        return `
          <article class="med-card" data-stock="${status}" data-id="${m.id}">
            <div class="med-thumb"><i class="hgi-stroke hgi-medicine-01" aria-hidden="true"></i></div>
            <div class="med-info">
              <h3 class="med-name">${m.name}</h3>
              <div class="med-meta">
                <span>${m.dose}</span>
                <span class="dot" aria-hidden="true"></span>
                <span>${m.category}</span>
              </div>
            </div>
            <div class="stock-pill ${status}">
              <i class="hgi-stroke ${icon}" aria-hidden="true"></i>
              <span>${m.stock}/${m.total} · ${label}</span>
            </div>
            <div class="med-actions">
              <button aria-label="更多操作" title="更多"><i class="hgi-stroke hgi-more-horizontal" aria-hidden="true"></i></button>
            </div>
          </article>`;
      }).join('');
    }

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderMeds(chip.dataset.filter);
      });
    });

    renderMeds('all');
  </script>
</body>
</html>
