# 仅手动触发：EAS 后台工作流页点 Run，或 eas workflow:run .eas/workflows/preview.yml
# 不监听任何 GitHub 事件 —— 提交代码 / 开 PR 都不会自动构建
name: Preview builds

on:
  workflow_dispatch: {}

jobs:
  build_ios_preview:
    name: Build iOS preview
    type: build
    params:
      platform: ios
      profile: preview

  build_android_preview:
    name: Build Android preview
    type: build
    params:
      platform: android
      profile: preview
