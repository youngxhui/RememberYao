# 仅手动触发：EAS 后台工作流页点 Run，或 eas workflow:run .eas/workflows/production.yml
# 不监听任何 GitHub 事件 —— 推送 main 不会自动构建
name: Production builds

on:
  workflow_dispatch: {}

jobs:
  build_ios_production:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  build_android_production:
    name: Build Android production
    type: build
    params:
      platform: android
      profile: production
